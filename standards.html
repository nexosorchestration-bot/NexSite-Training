<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standards — NexSite Studio Training</title>
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">N</div>
      <div>
        <div class="sidebar-brand-name" id="sb-name">NexSite Studio</div>
        <div class="sidebar-brand-sub">Training Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">Internal use only</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <div class="topbar-title">Standards</div>
      <div class="topbar-right"></div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h1>Standards</h1>
        <p>The practices and expectations that apply to all NexSite Studio work.</p>
      </div>

      <div class="standards-layout">
        <nav class="standards-nav" id="standards-nav"></nav>
        <div id="standards-content"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/portal-config.js"></script>
<script>
  (function () {
    var cfg = window.PORTAL_CONFIG || {};

    // Sidebar
    var nav = document.getElementById("sidebar-nav");
    var sb  = document.getElementById("sb-name");
    if (sb && cfg.org) sb.textContent = cfg.org.name;
    (cfg.nav || []).forEach(function (item) {
      var a = document.createElement("a");
      a.className = "nav-item" + (item.id === "standards" ? " active" : "");
      a.href = item.href;
      a.innerHTML = '<span class="nav-icon">' + item.icon + '</span>' + item.label;
      nav.appendChild(a);
    });
    document.getElementById("menu-toggle").addEventListener("click", function () {
      var s = document.getElementById("sidebar");
      var open = s.classList.toggle("open");
      this.classList.toggle("open", open);
    });

    // Standards nav
    var sNav    = document.getElementById("standards-nav");
    var sCont   = document.getElementById("standards-content");
    var stds    = cfg.standards || [];

    stds.forEach(function (std) {
      // Side nav link
      var a = document.createElement("a");
      a.className = "standards-nav-item";
      a.href = "#std-" + std.id;
      a.textContent = std.title;
      sNav.appendChild(a);

      // Article
      var article = document.createElement("div");
      article.className = "standard-article";
      article.id = "std-" + std.id;

      var header = document.createElement("div");
      header.className = "standard-article-header";
      header.innerHTML =
        '<div>' +
          '<div class="standard-article-title">' + std.title + '</div>' +
          '<div class="standard-article-summary">' + std.summary + '</div>' +
        '</div>' +
        '<span class="badge badge--neutral">' + std.category + '</span>';
      article.appendChild(header);

      (std.content || []).forEach(function (section) {
        var sec = document.createElement("div");
        sec.className = "standard-section";
        sec.innerHTML = '<h4>' + section.heading + '</h4><p>' + section.body + '</p>';
        article.appendChild(sec);
      });

      sCont.appendChild(article);
    });

    // Highlight active nav on scroll
    var navItems = sNav.querySelectorAll(".standards-nav-item");
    var articles = sCont.querySelectorAll(".standard-article");
    function updateActive() {
      var scrollY = window.scrollY;
      articles.forEach(function (art, i) {
        if (art.offsetTop - 100 <= scrollY) {
          navItems.forEach(function (n) { n.classList.remove("active"); });
          if (navItems[i]) navItems[i].classList.add("active");
        }
      });
    }
    window.addEventListener("scroll", updateActive, { passive: true });
    if (navItems[0]) navItems[0].classList.add("active");

  })();
</script>
</body>
</html>
